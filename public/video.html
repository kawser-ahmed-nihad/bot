<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Player</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#0f1115; color:#fff; text-align:center; padding:16px; }
  .thumb { width:100%; max-width:480px; height:240px; object-fit:cover; border-radius:14px; margin-top:12px; }
  h2 { margin:16px 0 6px; font-size:20px; }
  .status { color:#9aa0a6; margin-bottom:16px; font-size:14px; }
  .progress-wrap { width:100%; max-width:480px; height:8px; background:#22242c; border-radius:4px; margin:0 auto 20px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,#6a5cff,#8b7cff); width:0%; transition:width 1s linear; }
  button, .direct-btn { width:100%; max-width:480px; padding:16px; font-size:16px; font-weight:bold; border:none; border-radius:12px; margin:8px 0; cursor:pointer; box-sizing:border-box; display:inline-block; text-decoration:none; }
  .skip-btn { background:linear-gradient(135deg,#ff8a00,#ff5f6d); color:#fff; }
  .bonus-btn { background:#1c1e26; color:#9aa0a6; border:1px solid #2c2f3a !important; font-size:14px !important; padding:12px !important; }
  .direct-btn { background:#28a745; color:#fff; font-size:15px; margin-top:10px; }
  video { width:100%; max-width:480px; border-radius:12px; margin-top:16px; background:#000; }
  .error-msg { color:#ff6b6b; font-size:14px; margin-top:10px; display:none; }
</style>
</head>
<body>

<img class="thumb" id="thumb" src="" alt="thumbnail" style="display:none;">
<h2 id="titleEl">ভিডিও লোড হচ্ছে...</h2>
<p class="status" id="status">অনুগ্রহ করে অপেক্ষা করুন...</p>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div id="wait-section"></div>
<div id="video-section" style="display:none;">
  <!-- crossorigin="anonymous" এবং playsinline যোগ করা হয়েছে ভিডিও লোডিং সমস্যা কাটাতে -->
  <video id="player" controls playsinline autoplay crossorigin="anonymous"></video>
  
  <p class="error-msg" id="errorMsg">⚠️ ভিডিওটি সরাসরি ইন-অ্যাপ প্লেয়ারে প্লে হতে সমস্যা করছে।</p>
  <a id="fallbackBtn" class="direct-btn" href="#" target="_blank" style="display:none;">🌐 ব্রাউজারে বা সরাসরি দেখুন</a>
  
  <button class="bonus-btn" id="bonusBtn">🎁 চ্যানেলকে সাপোর্ট করতে একটি অ্যাড দেখুন</button>
</div>

<script>
const API_BASE_URL = "https://bot-jibt.onrender.com";

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const urlParams = new URLSearchParams(window.location.search);
const tgStartParam = tg.initDataUnsafe?.start_param;
const VIDEO_ID = tgStartParam || urlParams.get('startapp') || urlParams.get('id') || window.location.pathname.split("/").filter(Boolean).pop() || "demo";

const userId = tg.initDataUnsafe?.user?.id || 12345678;

const thumbEl = document.getElementById("thumb");
const titleEl = document.getElementById("titleEl");
const statusEl = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const waitSection = document.getElementById("wait-section");
const videoSection = document.getElementById("video-section");
const player = document.getElementById("player");
const bonusBtn = document.getElementById("bonusBtn");
const fallbackBtn = document.getElementById("fallbackBtn");
const errorMsg = document.getElementById("errorMsg");

const ADSGRAM_BLOCK_ID = "YOUR_ADSGRAM_BLOCK_ID";
const AdController = (window.Adsgram && ADSGRAM_BLOCK_ID !== "YOUR_ADSGRAM_BLOCK_ID") 
  ? window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID }) 
  : null;

let WAIT_SECONDS = 15;
let secondsLeft = WAIT_SECONDS;
let timerInterval = null;
let currentVideoUrl = "";

// 📌 ভিডিও প্লে হতে সমস্যা হলে অটোমেটিক ফলব্যাক বাটন অন করার হ্যান্ডলার
player.onerror = () => {
  if (currentVideoUrl) {
    errorMsg.style.display = "block";
    fallbackBtn.href = currentVideoUrl;
    fallbackBtn.style.display = "inline-block";
  }
};

async function fetchVideoInfo() {
  try {
    const res = await fetch(`${API_BASE_URL}/api/video/${VIDEO_ID}`);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

async function fetchProgress() {
  try {
    const res = await fetch(`${API_BASE_URL}/api/progress/${VIDEO_ID}?user_id=${userId}`);
    if (!res.ok) return { unlocked: false };
    return await res.json();
  } catch (e) {
    return { unlocked: false };
  }
}

async function callApi(path) {
  try {
    const res = await fetch(`${API_BASE_URL}${path}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId }),
    });
    return await res.json();
  } catch (e) {
    return { unlocked: true, video_url: currentVideoUrl };
  }
}

function renderWaitUI() {
  waitSection.innerHTML = "";
  progressWrap.style.display = "block";
  const btn = document.createElement("button");
  btn.className = "skip-btn";
  btn.textContent = "⚡ Skip Wait — Watch 1 Ad";
  btn.onclick = watchSkipAd;
  waitSection.appendChild(btn);
  startTimer();
}

function startTimer() {
  updateTimerUI();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(async () => {
    secondsLeft -= 1;
    updateTimerUI();
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      const result = await callApi(`/api/wait-finished/${VIDEO_ID}`);
      renderUnlocked(result.video_url || currentVideoUrl);
    }
  }, 1000);
}

function updateTimerUI() {
  statusEl.textContent = `🆓 ফ্রি ভিডিও ${secondsLeft} সেকেন্ড পরে খুলবে, অথবা অ্যাড দেখে এখনই দেখুন`;
  const pct = Math.max(0, ((WAIT_SECONDS - secondsLeft) / WAIT_SECONDS) * 100);
  progressBar.style.width = pct + "%";
}

function renderUnlocked(videoUrl) {
  if (timerInterval) clearInterval(timerInterval);
  statusEl.textContent = "🎉 ভিডিওটি উপভোগ করুন!";
  progressWrap.style.display = "none";
  waitSection.innerHTML = "";
  videoSection.style.display = "block";
  
  const finalUrl = videoUrl || currentVideoUrl;
  if (finalUrl) {
    currentVideoUrl = finalUrl;
    player.src = finalUrl;
    player.load();

    // চেষ্টা করবে প্লে করার জন্য
    const playPromise = player.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        // অটো-প্লে ব্রাউজার ব্লক করলে বা ভিডিও লোড ফেইল হলে অপশন শো করবে
        fallbackBtn.href = finalUrl;
        fallbackBtn.style.display = "inline-block";
      });
    }
  }
}

async function watchSkipAd() {
  if (!AdController) { 
    const result = await callApi(`/api/skip-wait/${VIDEO_ID}`);
    renderUnlocked(result.video_url || currentVideoUrl);
    return; 
  }

  try {
    await AdController.show();
    const result = await callApi(`/api/skip-wait/${VIDEO_ID}`);
    renderUnlocked(result.video_url || currentVideoUrl);
  } catch (e) {
    console.log("Ad cancelled");
  }
}

bonusBtn.onclick = async () => {
  if (!AdController) {
    await callApi(`/api/bonus-ad/${VIDEO_ID}`);
    bonusBtn.textContent = "❤️ ধন্যবাদ সাপোর্ট করার জন্য!";
    bonusBtn.disabled = true;
    return;
  }
  try {
    await AdController.show();
    await callApi(`/api/bonus-ad/${VIDEO_ID}`);
    bonusBtn.textContent = "❤️ ধন্যবাদ সাপোর্ট করার জন্য!";
    bonusBtn.disabled = true;
  } catch (e) {}
};

async function init() {
  let videoInfo = await fetchVideoInfo();
  
  if (videoInfo) {
    currentVideoUrl = videoInfo.video_url;
  } else {
    videoInfo = {
      id: "demo",
      title: "Sample Video Player",
      thumbnail_url: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800&q=80",
      wait_seconds: 15,
      video_url: "https://vjs.zencdn.net/v/oceans.mp4"
    };
    currentVideoUrl = videoInfo.video_url;
  }

  document.title = videoInfo.title;
  titleEl.textContent = videoInfo.title;
  thumbEl.src = videoInfo.thumbnail_url;
  thumbEl.style.display = "inline-block";
  WAIT_SECONDS = videoInfo.wait_seconds || 15;
  secondsLeft = WAIT_SECONDS;

  const progress = await fetchProgress();
  if (progress && progress.unlocked) {
    renderUnlocked(progress.video_url || currentVideoUrl);
  } else {
    renderWaitUI();
  }
}

init();
</script>
</body>
</html>
