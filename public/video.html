<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Video</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='11420971' data-sdk='show_11420971'></script>

<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:#0f1115; color:#fff; text-align:center; padding:16px; }
  .thumb { width:100%; max-width:480px; height:240px; object-fit:cover; border-radius:14px; margin-top:12px; display:none; }
  h2 { margin:16px 0 6px; font-size:20px; }
  .status { color:#9aa0a6; margin-bottom:16px; font-size:14px; }
  button { width:100%; max-width:480px; padding:16px; font-size:16px; font-weight:bold; border:none; border-radius:12px; margin:8px 0; cursor:pointer; box-sizing:border-box; }
  .watch-btn { background:linear-gradient(135deg,#6a5cff,#8b7cff); color:#fff; }
  .progress-box { background:#1c1e26; border:1px solid #2c2f3a; border-radius:10px; padding:12px; margin-top:10px; max-width:480px; margin-left:auto; margin-right:auto; }
</style>
</head>
<body>

<img class="thumb" id="thumb" alt="thumbnail">
<h2 id="titleEl">ভিডিও লোড হচ্ছে...</h2>
<p class="status" id="status">ইনবক্সে ভিডিও পেতে নিচের ধাপগুলো পূরণ করুন</p>

<div class="progress-box">
  <p id="adProgress">অ্যাড দেখা হয়েছে: <b>0 / 2</b></p>
</div>

<button class="watch-btn" id="watchBtn">▶️ ২টি অ্যাড দেখুন ও ইনবক্সে ভিডিও নিন</button>

<script>
const API_BASE_URL = "https://bot-jibt.onrender.com";

const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const urlParams = new URLSearchParams(window.location.search);
const tgStartParam = tg.initDataUnsafe?.start_param;
const VIDEO_ID = tgStartParam || urlParams.get('startapp') || urlParams.get('id') || window.location.pathname.split("/").filter(Boolean).pop();

const userId = tg.initDataUnsafe?.user?.id;

const thumbEl = document.getElementById("thumb");
const titleEl = document.getElementById("titleEl");
const statusEl = document.getElementById("status");
const watchBtn = document.getElementById("watchBtn");
const adProgress = document.getElementById("adProgress");

// Monetag SDK Trigger Function
const MONETAG_ZONE_ID = "11420971";
function showMonetagAd() {
  const fn = window["show_" + MONETAG_ZONE_ID];
  if (typeof fn === "function") {
    return fn();
  }
  return Promise.reject(new Error("Monetag SDK not loaded"));
}

async function init() {
  try {
    const res = await fetch(`${API_BASE_URL}/api/video/${VIDEO_ID}`);
    if (res.ok) {
      const data = await res.json();
      titleEl.textContent = data.title;
      if (data.thumbnail_url) {
        thumbEl.src = data.thumbnail_url;
        thumbEl.style.display = "inline-block";
      }
    }
  } catch (e) {
    titleEl.textContent = "ভিডিও লোড করা যাচ্ছে না";
  }
}

// ---------- শুধু Monetag দিয়ে ২টি অ্যাড দেখানোর লজিক ----------
watchBtn.onclick = async () => {
  if (!userId) {
    alert("ইউজার আইডি পাওয়া যায়নি! টেলিগ্রাম থেকে মিনি অ্যাপটি ওপেন করুন।");
    return;
  }

  watchBtn.disabled = true;
  let adsWatchedCount = 0;

  // ---------------- ১ নম্বর অ্যাড (Monetag 1st Attempt) ----------------
  try {
    statusEl.textContent = "⏳ ১ম অ্যাড চালু হচ্ছে...";
    await showMonetagAd();
    adsWatchedCount++;
    adProgress.innerHTML = "অ্যাড দেখা হয়েছে: <b>1 / 2</b> ✅";
  } catch (e) {
    console.log("1st Monetag Ad skipped/blocked:", e);
    // অ্যাড স্কিপ/ফেল করলেও প্রগ্রেস ১ বাড়িয়ে দেওয়া হচ্ছে যেন ফ্লো আটকে না থাকে
    adsWatchedCount++;
    adProgress.innerHTML = "অ্যাড দেখা হয়েছে: <b>1 / 2</b> ✅";
  }

  // ১ম ও ২য় অ্যাডের মাঝে ১ সেকেন্ডের ছোট একটা পজ
  await new Promise(resolve => setTimeout(resolve, 1000));

  // ---------------- ২ নম্বর অ্যাড (Monetag 2nd Attempt) ----------------
  try {
    statusEl.textContent = "⏳ ২য় অ্যাড চালু হচ্ছে...";
    await showMonetagAd();
    adsWatchedCount++;
    adProgress.innerHTML = "অ্যাড দেখা হয়েছে: <b>2 / 2</b> ✅";
  } catch (e) {
    console.log("2nd Monetag Ad skipped/blocked:", e);
    adsWatchedCount = 2;
    adProgress.innerHTML = "অ্যাড দেখা হয়েছে: <b>2 / 2</b> ✅";
  }

  // ব্যাকএন্ডে রিকোয়েস্ট পাঠানো
  statusEl.textContent = "⏳ ইনবক্সে ভিডিও পাঠানো হচ্ছে...";

  try {
    const response = await fetch(`${API_BASE_URL}/api/send-video`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        user_id: userId,
        video_id: VIDEO_ID,
        ads_completed: adsWatchedCount
      })
    });

    const resData = await response.json();

    if (resData.success) {
      tg.showAlert("✅ " + resData.message + "\nআপনার টেলিগ্রাম চ্যাট লিস্টটি চেক করুন।");
      tg.close();
    } else {
      tg.showAlert("❌ " + resData.message);
      watchBtn.disabled = false;
      watchBtn.textContent = "আবার চেষ্টা করুন";
    }
  } catch (err) {
    alert("ভিডিও ডেলিভারি নিতে সমস্যা হয়েছে।");
    watchBtn.disabled = false;
    watchBtn.textContent = "আবার চেষ্টা করুন";
  }
};

init();
</script>
</body>
</html>
